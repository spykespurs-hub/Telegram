<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
// Set the theme before first paint, straight from localStorage, so the
// page never flashes the default dark theme before switching to a
// saved light/system preference.
(function(){
  try{
    var t = window.localStorage.getItem("ups_monitor_theme_v1") || "dark";
    document.documentElement.setAttribute("data-theme", t);
  }catch(e){ /* localStorage unavailable — default theme stands */ }
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>MUPS Watch — UPS &amp; STS Monitoring Log</title>
<meta name="theme-color" content="#0A0E13">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MUPS Watch">
<!-- Filled in at runtime by setupPWA() with a blob: manifest, reusing
     the APSI logo already embedded below as the app icon — this is what
     lets Android's "Add to Home screen" install it as a standalone,
     full-screen app (no browser address bar) instead of a bookmark. -->
<link rel="manifest" id="pwaManifestLink">
<link rel="apple-touch-icon" id="pwaAppleIcon">
<style>
  :root{
    color-scheme: dark light;
    --bg:#0A0E13;
    --panel:#111721;
    --panel-2:#182130;
    --panel-3:#1F2A3B;
    --border:#26333F;
    --border-soft:#1C2732;
    --text:#E7EEF5;
    --text-dim:#8FA0AF;
    --text-faint:#5C6C7A;
    --amber:#F2A93B;
    --amber-dim:#7A5A22;
    --green:#33D690;
    --green-dim:#1B4A38;
    --red:#FF5D6C;
    --red-dim:#5A2028;
    --blue:#5AA9E6;
    --body-glow-1:#101c26;
    --body-glow-2:#1a1420;
    --topbar-1:#0D1319; --topbar-2:#0B1015;
    --font-display:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
    --font-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --font-mono:ui-monospace,"Cascadia Mono","SF Mono","Roboto Mono",Consolas,Menlo,monospace;
    --radius:10px;
  }
  /* ---------- Themes ----------
     Everything in the app is already driven by the CSS variables
     above, so a theme is just a different set of values for the same
     variables, swapped via a data-theme attribute on <html>. "system"
     mirrors the light theme only when the OS/browser is set to light
     mode, so it follows the device automatically. These are placed
     before html.printing below so print/export always wins regardless
     of which theme is active on screen. */
  html[data-theme="light"]{
    --bg:#F3F5F8; --panel:#FFFFFF; --panel-2:#FFFFFF; --panel-3:#EDF1F6;
    --border:#D6DEE6; --border-soft:#E6ECF2;
    --text:#182430; --text-dim:#57687A; --text-faint:#93A3B2;
    --amber:#A9660A; --amber-dim:#F4E2BC;
    --green:#0E8F5B; --green-dim:#D6F2E4;
    --red:#D0323E; --red-dim:#FBE1E3;
    --blue:#1D6FB8;
    --body-glow-1:#e9eef4; --body-glow-2:#eef1e7;
    --topbar-1:#FFFFFF; --topbar-2:#F0F3F7;
  }
  html[data-theme="light"] ::selection{ color:#fff; }
  @media (prefers-color-scheme: light){
    html[data-theme="system"]{
      --bg:#F3F5F8; --panel:#FFFFFF; --panel-2:#FFFFFF; --panel-3:#EDF1F6;
      --border:#D6DEE6; --border-soft:#E6ECF2;
      --text:#182430; --text-dim:#57687A; --text-faint:#93A3B2;
      --amber:#A9660A; --amber-dim:#F4E2BC;
      --green:#0E8F5B; --green-dim:#D6F2E4;
      --red:#D0323E; --red-dim:#FBE1E3;
      --blue:#1D6FB8;
      --body-glow-1:#e9eef4; --body-glow-2:#eef1e7;
      --topbar-1:#FFFFFF; --topbar-2:#F0F3F7;
    }
    html[data-theme="system"] ::selection{ color:#fff; }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, var(--body-glow-1) 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, var(--body-glow-2) 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:var(--amber);color:#1a1204;}

  /* ---------- Toolbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:50;
    background:linear-gradient(180deg,var(--topbar-1) 0%, var(--topbar-2) 100%);
    border-bottom:1px solid var(--border);
    padding:10px 14px;
    display:flex; flex-wrap:wrap; align-items:center; gap:10px;
    backdrop-filter:blur(6px);
  }
  .brand{
    display:flex; align-items:center; gap:10px; margin-right:auto;
  }
  .brand .dot{
    width:11px;height:11px;border-radius:50%;
    background:var(--green);
    box-shadow:0 0 0 3px var(--green-dim), 0 0 10px var(--green);
    animation:pulse 2.4s ease-in-out infinite;
    flex:none;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.45;} }
  .brand h1{
    font-family:var(--font-display); font-weight:700;
    font-size:16px; letter-spacing:.4px; margin:0; color:var(--text);
  }
  .brand small{display:block; font-size:10.5px; color:var(--text-faint); letter-spacing:1.5px; text-transform:uppercase; font-family:var(--font-mono);}
  .toolbar-actions{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .btn{
    font-family:var(--font-body); font-weight:600; font-size:12.5px;
    border:1px solid var(--border); background:var(--panel-2); color:var(--text);
    padding:8px 12px; border-radius:8px; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
    transition:.15s border-color, .15s background, .15s transform;
    white-space:nowrap;
  }
  .btn:hover{border-color:var(--text-faint); transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn.primary{background:linear-gradient(180deg,#2b3a2f,#1c281f); border-color:var(--green-dim); color:#BFF3DA;}
  .btn.primary:hover{border-color:var(--green);}
  .btn.warn{background:linear-gradient(180deg,#3a2f1c,#281f14); border-color:var(--amber-dim); color:#FBE0AC;}
  .btn.warn:hover{border-color:var(--amber);}
  .btn.ghost{background:var(--panel-3); color:var(--text);}
  .zoomctl{
    display:flex; align-items:center; gap:2px; border:1px solid var(--border);
    border-radius:8px; overflow:hidden; background:var(--panel-2);
  }
  .zoomctl button{
    border:none; background:transparent; color:var(--text); font-size:15px; font-weight:700;
    width:32px; height:32px; cursor:pointer; font-family:var(--font-mono);
  }
  .zoomctl button:hover{background:var(--panel-3);}
  .zoomctl .zlabel{
    font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim);
    width:46px; text-align:center; border-left:1px solid var(--border); border-right:1px solid var(--border);
    height:32px; display:flex; align-items:center; justify-content:center;
  }
  .savebadge{
    font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint);
    padding:6px 8px; letter-spacing:.5px;
  }
  .savebadge.saved{color:var(--green);}

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex; gap:6px; padding:10px 14px 0; overflow-x:auto;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    font-family:var(--font-mono); font-size:12px; font-weight:600; letter-spacing:.4px;
    color:var(--text-dim); background:var(--panel);
    border:1px solid var(--border); border-bottom:none;
    padding:10px 16px 12px; border-radius:10px 10px 0 0; cursor:pointer;
    white-space:nowrap; position:relative; top:1px;
  }
  .tab .tag{display:block; font-size:9px; color:var(--text-faint); letter-spacing:1.5px; margin-top:2px;}
  .tab.active{
    color:var(--amber); background:var(--panel-2); border-color:var(--border);
    border-bottom:1px solid var(--panel-2);
  }
  .tab .alarm-pip{
    display:inline-block; min-width:16px; padding:0 4px; height:16px; line-height:16px;
    border-radius:8px; background:var(--red-dim); color:var(--red); font-size:10px; text-align:center;
    margin-left:6px; font-family:var(--font-mono);
  }

  /* ---------- Content ---------- */
  .stage{ padding:0 14px 60px; }
  .zoomwrap{
    background:var(--panel-2); border:1px solid var(--border); border-radius:0 10px 10px 10px;
    padding:16px; margin-top:0;
  }
  .room-panel{display:none;}
  .room-panel.active{display:block;}

  .headerbar{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px;
    margin-bottom:16px;
  }
  .panel-toolbar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px;
  }
  .collapse-toggle{
    font-family:var(--font-mono); font-size:11px; font-weight:600; color:var(--text-dim);
    background:var(--panel-2); border:1px solid var(--border); border-radius:999px;
    padding:5px 12px; cursor:pointer;
  }
  .collapse-toggle:hover{ color:var(--text); border-color:var(--text-faint); }
  .collapsed-summary{
    font-family:var(--font-mono); font-size:11px; color:var(--text-faint);
  }
  .field-group{
    background:var(--panel); border:1px solid var(--border-soft); border-radius:8px;
    padding:8px 10px;
  }
  .field-group label{
    display:block; font-size:9.5px; letter-spacing:1.4px; text-transform:uppercase;
    color:var(--text-faint); font-family:var(--font-mono); margin-bottom:4px;
  }
  .field-group input, .field-group textarea{
    width:100%; background:transparent; border:none; color:var(--text);
    font-family:var(--font-mono); font-size:13.5px; padding:0; outline:none;
  }
  .field-group.location .value{
    font-family:var(--font-display); font-weight:700; color:var(--amber); font-size:14px;
  }
  .field-group.techpicker{ grid-column:span 2; position:relative; }
  @media (max-width:520px){ .field-group.techpicker{ grid-column:span 1; } }
  .tech-chips{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .tech-chip{
    display:inline-flex; align-items:center; gap:5px; background:var(--panel-3);
    border:1px solid var(--border-soft); color:var(--text); font-family:var(--font-mono);
    font-size:11.5px; padding:3px 4px 3px 9px; border-radius:999px;
  }
  .tech-chip-x{
    background:transparent; border:none; color:var(--text-faint); cursor:pointer;
    width:16px; height:16px; border-radius:50%; font-size:11px; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .tech-chip-x:hover{ background:var(--red-dim); color:var(--red); }
  .tech-chip-empty{ font-family:var(--font-mono); font-size:11.5px; color:var(--text-faint); }
  .tech-add-btn{
    font-family:var(--font-mono); font-size:11px; font-weight:600; color:var(--green);
    background:transparent; border:1px dashed var(--green-dim); border-radius:999px;
    padding:3px 10px; cursor:pointer;
  }
  .tech-add-btn:hover{ border-color:var(--green); }
  .tech-dropdown{
    position:absolute; z-index:40; top:100%; left:0; margin-top:6px; width:min(320px,90vw);
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:10px; box-shadow:0 12px 30px rgba(0,0,0,.4);
  }
  .tech-roster-list{ display:flex; flex-direction:column; gap:3px; max-height:180px; overflow-y:auto; margin-bottom:8px; }
  .tech-item{ display:flex; align-items:center; gap:4px; }
  .tech-item-btn{
    flex:1; text-align:left; background:transparent; border:1px solid transparent; color:var(--text-dim);
    font-family:var(--font-mono); font-size:12px; padding:5px 8px; border-radius:6px; cursor:pointer;
  }
  .tech-item-btn:hover{ background:var(--panel-3); color:var(--text); }
  .tech-item.on .tech-item-btn{ color:var(--green); }
  .tech-item-del{
    background:transparent; border:none; color:var(--text-faint); cursor:pointer;
    width:18px; height:18px; border-radius:4px; font-size:11px; flex:none;
  }
  .tech-item-del:hover{ background:var(--red-dim); color:var(--red); }
  .tech-item-empty{ font-family:var(--font-mono); font-size:11px; color:var(--text-faint); padding:4px 6px; }
  .tech-new-row{ display:flex; gap:6px; }
  .tech-new-row .cell-input{ flex:1; width:auto; text-align:left; }

  .section-title{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin:22px 0 8px;
  }
  .section-title h2{
    font-family:var(--font-display); font-size:14px; margin:0; color:var(--text);
    display:flex; align-items:center; gap:8px;
  }
  .section-title h2 .idx{
    font-family:var(--font-mono); color:var(--text-faint); font-size:11px;
  }
  .legend{
    display:flex; gap:12px; font-size:10px; color:var(--text-faint); font-family:var(--font-mono);
    flex-wrap:wrap;
  }
  .legend span{display:inline-flex; align-items:center; gap:4px;}
  .legend i{width:8px;height:8px;border-radius:2px;display:inline-block;}

  .summary-chip{
    font-family:var(--font-mono); font-size:11px; font-weight:600; padding:5px 10px;
    border-radius:999px; border:1px solid var(--green-dim); background:rgba(51,214,144,.08); color:var(--green);
  }
  .summary-chip.alarm{border-color:var(--red-dim); background:rgba(255,93,108,.1); color:var(--red);}

  .table-scroll{
    overflow:auto; max-height:min(62vh, 480px);
    border:1px solid var(--border-soft); border-radius:8px; position:relative;
  }
  /* Frozen header row + frozen equipment column, spreadsheet-style — so
     while entering readings, the column labels (Input Voltage, etc.) stay
     visible when scrolling the table vertically, and the equipment name
     stays visible when scrolling it horizontally. Each table gets its own
     bounded, independently-scrollable viewport (max-height above) so this
     works without hijacking the whole page's scroll. Disabled entirely
     during PDF export/print further below, so exported pages still show
     the full table at full height with normal static layout. */
  table.grid thead{ position:sticky; top:0; z-index:3; }
  table.grid thead tr.group th:first-child{ position:sticky; left:0; z-index:4; }
  td.eqcell{ position:sticky; left:0; z-index:1; background:var(--panel); }
  table.grid tbody tr:nth-child(even) td.eqcell{ background:var(--panel-3); }
  table.grid tbody tr:hover td.eqcell{ background:var(--panel-3); }
  table.grid{ border-collapse:collapse; width:100%; min-width:max-content; }
  table.grid th, table.grid td{
    border-bottom:1px solid var(--border-soft); border-right:1px solid var(--border-soft);
    padding:6px 6px; text-align:center; font-size:12px;
  }
  table.grid th:last-child, table.grid td:last-child{border-right:none;}
  table.grid thead th{
    background:var(--panel-3); color:var(--text-dim); font-family:var(--font-mono);
    font-weight:600; font-size:10px; letter-spacing:.4px; text-transform:uppercase;
    white-space:nowrap;
  }
  table.grid thead tr.group th{background:var(--panel-3); color:var(--amber); font-size:10px;}
  table.grid tbody tr:nth-child(even){background:rgba(255,255,255,.015);}
  table.grid tbody tr:hover{background:rgba(90,169,230,.05);}
  td.eqcell{ text-align:left; font-family:var(--font-mono); min-width:92px; max-width:92px; }
  td.eqcell .cap{display:block; font-size:9.5px; color:var(--text-faint); margin-top:1px;}
  .eq-name-row{ display:flex; align-items:center; gap:4px; }
  .eq-name-row .eqname-input{ flex:1; min-width:0; }

  .cell-input{
    width:64px; background:var(--panel); border:1px solid var(--border-soft); color:var(--text);
    font-family:var(--font-mono); font-size:12.5px; text-align:center; border-radius:6px;
    padding:5px 3px; outline:none; -moz-appearance:textfield;
  }
  .cell-input.wide{width:88px;}
  .cell-input.narrow{width:52px;}
  .cell-input.time-input.narrow{width:88px;}
  .cell-input.time-input{color-scheme:dark;}
  .cell-input::-webkit-outer-spin-button, .cell-input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .cell-input:focus{border-color:var(--blue); box-shadow:0 0 0 2px rgba(90,169,230,.2);}
  .cell-input.alarm{border-color:var(--red); color:var(--red); background:rgba(255,93,108,.08); font-weight:700;}
  .cell-input.warn{border-color:var(--amber); color:var(--amber); background:rgba(242,169,59,.08); font-weight:700;}
  select.cell-input{ -webkit-appearance:none; appearance:none; }
  select.cell-input.st-normal{color:var(--green); border-color:var(--green-dim);}
  select.cell-input.st-abnormal{color:var(--red); border-color:var(--red);}
  select.cell-input.st-charging{color:var(--blue); border-color:#2a4a63;}
  select.cell-input.st-off{color:var(--text-faint);}
  .eqname-input{
    background:transparent; border:none; border-bottom:1px dashed var(--border-soft); color:var(--text);
    font-family:var(--font-mono); font-size:12.5px; width:100%; padding:2px 0; min-width:0;
  }
  .cap-input{
    background:transparent; border:none; color:var(--text-faint); font-family:var(--font-mono);
    font-size:9.5px; width:100%; padding:0;
  }

  textarea.remarks{
    width:100%; min-height:70px; background:var(--panel); border:1px solid var(--border-soft);
    border-radius:8px; color:var(--text); font-family:var(--font-mono); font-size:13px;
    padding:10px; resize:vertical; outline:none;
  }
  .remarksrow{display:grid; grid-template-columns:2fr 1fr; gap:12px; margin-top:8px;}
  @media (max-width:640px){ .remarksrow{grid-template-columns:1fr;} }

  .footer-note{
    margin-top:26px; padding-top:12px; border-top:1px dashed var(--border-soft);
    font-size:10.5px; color:var(--text-faint); font-family:var(--font-mono); line-height:1.6;
  }


  /* =====================================================================
     V11_13 UI REFRESH — presentation only. Everything below uses the
     existing CSS variables, so all three themes keep working.
     ===================================================================== */
  :root{ --shadow:0 1px 2px rgba(0,0,0,.28),0 4px 14px rgba(0,0,0,.18); --nav-h:58px; }
  html[data-theme="light"]{ --shadow:0 1px 2px rgba(20,40,60,.08),0 3px 10px rgba(20,40,60,.07); }
  @media (prefers-color-scheme:light){ html[data-theme="system"]{ --shadow:0 1px 2px rgba(20,40,60,.08),0 3px 10px rgba(20,40,60,.07); } }
  .topbar{ box-shadow:var(--shadow); }
  .brand .dot{ animation:none; }                                   /* status dot is now static + meaningful */
  html[data-status="warn"] .brand .dot{ background:var(--amber); box-shadow:0 0 0 3px var(--amber-dim); }
  html[data-status="crit"] .brand .dot{ background:var(--red); box-shadow:0 0 0 3px var(--red-dim); }
  button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }
  .btn{ min-height:38px; } .btn:active{ transform:scale(.97); }
  .tab{ min-height:44px; }
  .view-switch button{ min-height:36px; padding:0 14px; }
  .fleet-card,.ups-card{ box-shadow:var(--shadow); }
  .table-scroll{ -webkit-overflow-scrolling:touch; }
  table.grid td.eqcell{ position:sticky; left:0; z-index:1; background:var(--panel); }   /* unit name stays visible while scrolling sideways */
  @keyframes vfade{ from{opacity:.25} to{opacity:1} }
  .room-panel.active,#dashHost.active,#batteryHost.active{ animation:vfade .16s ease-out; }
  @media (prefers-reduced-motion:reduce){ *,*::before,*::after{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }

  /* ---------- status badges (symbol + word, so never colour-only) ---------- */
  .sbadge{ display:inline-flex; align-items:center; gap:5px; font:700 10.5px var(--font-mono); letter-spacing:.04em; padding:3px 9px; border-radius:999px; border:1px solid; white-space:nowrap; }
  .sbadge i{ font-style:normal; font-size:11px; }
  .sb-ok{ color:var(--green); background:var(--green-dim); border-color:var(--green); }
  .sb-warn{ color:var(--amber); background:var(--amber-dim); border-color:var(--amber); }
  .sb-crit{ color:var(--red); background:var(--red-dim); border-color:var(--red); }
  .sb-off{ color:var(--text-dim); background:transparent; border-color:var(--text-faint); border-style:dashed; }

  /* ---------- dashboard ---------- */
  #dashHost{ display:none; } #dashHost.act
